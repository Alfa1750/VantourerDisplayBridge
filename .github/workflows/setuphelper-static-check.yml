name: SetupHelper package checks

on:
  push:
    branches:
      - setuphelper-package
  pull_request:
    branches:
      - main

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: |
          bash -n setup
          sh -n services/VantourerDisplayBridge/run
          sh -n services/VantourerDisplayBridge/log/run
          bash -n tests/setuphelper-harness.sh
      - name: Test SetupHelper control flow with mocked framework
        run: bash tests/setuphelper-harness.sh
      - name: Check Python syntax
        run: python -m py_compile src/gatt_server.py src/tcp_client.py src/ble_framing.py
      - name: Test TCP client
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test Node-RED battery normalization Function
        run: node --test flows/node-red/tests/normalize_batteries_function.test.js
      - name: Check Node-RED flow JSON
        run: |
          python -m json.tool flows/node-red/ble-test-flow.json > /dev/null
          python -m json.tool flows/node-red/battery-display-v039-import.json > /dev/null
      - name: Check package layout and executable permissions
        run: |
          test -f version
          test -f gitHubInfo
          test -f ReadMe.md
          test -x setup
          test -x services/VantourerDisplayBridge/run
          test -x services/VantourerDisplayBridge/log/run
          grep -q "NodeRedTcpClient" src/gatt_server.py
          ! grep -q "def send_test_notification" src/gatt_server.py
